# Web server port inside the container
server.port=8080

# Database connection comes from environment variables (set by Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate creates or updates tables to match the entities
spring.jpa.hibernate.ddl-auto=update
# No lazy DB queries while rendering the web response
spring.jpa.open-in-view=false

# Expose only the health endpoint and show database status in it
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
