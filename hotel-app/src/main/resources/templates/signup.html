<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Sign up</title>
</head>
<body>
<main>
    <h1>Sign up</h1>
    <p>New accounts are always customer accounts.</p>
    <!-- Message from LoginController, e.g. "Username is already taken" -->
    <p th:if="${error}" th:text="${error}">Error</p>
    <form th:action="@{/signup}" method="post">
        <p><label>Username <input type="text" name="username" th:value="${username}" required></label></p>
        <p><label>Password (at least 8 characters) <input type="password" name="password" required></label></p>
        <button type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</main>
</body>
</html>
