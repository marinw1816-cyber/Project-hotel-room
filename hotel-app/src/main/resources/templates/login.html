<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Login</title>
</head>
<body>
<main>
    <h1>Login</h1>
    <!-- Spring Security adds ?error, ?logout; LoginController adds ?signedUp -->
    <p th:if="${param.error}">Wrong username or password.</p>
    <p th:if="${param.logout}">You are logged out.</p>
    <p th:if="${param.signedUp}">Account created, please log in.</p>
    <!-- th:action adds the CSRF token as a hidden field -->
    <form th:action="@{/login}" method="post">
        <p><label>Username <input type="text" name="username" required></label></p>
        <p><label>Password <input type="password" name="password" required></label></p>
        <button type="submit">Login</button>
    </form>
    <p>No account yet? <a th:href="@{/signup}">Sign up</a></p>
</main>
</body>
</html>
