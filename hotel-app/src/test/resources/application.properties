# Test settings: replaces src/main/resources/application.properties during mvn test

# In-memory H2 database, so tests run without MariaDB (e.g. in GitHub CI)
spring.datasource.url=jdbc:h2:mem:hoteltest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Fresh tables for every test run
spring.jpa.hibernate.ddl-auto=create-drop
# No lazy DB queries while rendering the web response
spring.jpa.open-in-view=false

# Same actuator settings as in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
