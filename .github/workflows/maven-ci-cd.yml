name: Example_101 CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ARGUMENT: "Wonderful"

jobs:

  # BUILD
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Example_101/pom.xml

      - name: Check Java version
        run: |
          java -version
          javac -version
          mvn --version

      - name: Compile application
        working-directory: Example_101
        run: |
          mvn --batch-mode --no-transfer-progress clean compile


  # TEST
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Example_101/pom.xml

      - name: Check Java version
        run: |
          java -version
          javac -version

      - name: Run JUnit tests
        working-directory: Example_101
        run: |
          mvn --batch-mode --no-transfer-progress test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: Example_101/target/surefire-reports/


  # PACKAGE
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Example_101/pom.xml

      - name: Check Java version
        run: |
          java -version
          javac -version

      - name: Create executable JAR
        working-directory: Example_101
        run: |
          mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: List target directory
        working-directory: Example_101
        run: |
          ls -la target/

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: example-101-jar
          path: Example_101/target/*.jar


  # RUN
  run:
    name: Run application
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check Java version
        run: |
          java -version
          javac -version

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: example-101-jar
          path: application

      - name: List application files
        run: |
          ls -la application/

      - name: Run application
        run: |
          java -jar application/*.jar "$APP_ARGUMENT"


  # DEPLOY
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: run

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check Java version
        run: |
          java -version

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: example-101-jar
          path: application

      - name: List deployment package
        run: |
          ls -la application/

      - name: Deployment placeholder
        run: |
          echo "DEPLOYMENT STAGE"
          echo "Example_101 has been successfully built, tested and packaged."
          echo "The JAR is ready for deployment to shell.puv.fi."
