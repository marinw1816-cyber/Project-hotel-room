# GitLab CI/CD pipeline for the hotel app (Final Project)
# Runs on every push to GitLab: build, test, package.
# Docker images are built and pushed by Jenkins (see Jenkinsfile), not here.

# Same Maven and Java 21 image as in hotel-app/Dockerfile
image: maven:3.9.6-eclipse-temurin-21

variables:
  # Keep downloaded libraries inside the project folder, so the cache can store them
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # Short Maven output without download logs
  MAVEN_CLI: "--batch-mode --no-transfer-progress"

# Reuse downloaded libraries in the next pipeline (faster)
cache:
  key: hotel-app-maven
  paths:
    - .m2/repository/

stages:
  - build
  - test
  - package

build:
  stage: build
  script:
    - cd hotel-app
    - mvn $MAVEN_CLI clean compile

test:
  stage: test
  script:
    - cd hotel-app
    # Tests use the H2 in-memory database, no MariaDB needed
    - mvn $MAVEN_CLI test
  artifacts:
    # Keep the reports even if a test fails
    when: always
    reports:
      # GitLab shows the results in the "Tests" tab of the pipeline
      junit:
        - hotel-app/target/surefire-reports/TEST-*.xml
    expire_in: 1 week

package:
  stage: package
  script:
    - cd hotel-app
    # Tests already ran in the test stage
    - mvn $MAVEN_CLI clean package -DskipTests
  artifacts:
    # The runnable Spring Boot JAR, downloadable from the pipeline page
    paths:
      - hotel-app/target/hotel-app-*.jar
    expire_in: 1 month
