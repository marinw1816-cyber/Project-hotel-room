image: maven:3.9.11-eclipse-temurin-25

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  APP_ARGUMENT: "Wonderful"

cache:
  paths:
    - .m2/repository/

stages:
  - build
  - test
  - package
  - run
  - deploy

before_script:
  - echo "Setting up CI/CD environment"
  - mvn --version
  - java -version

build:
  stage: build

  script:
    - echo "BUILD STAGE"
    - echo "Compiling Java source code"
    - cd Example_101
    - mvn --batch-mode --no-transfer-progress clean compile

  artifacts:
    name: "example-101-build"
    paths:
      - Example_101/target/classes/
    expire_in: 1 week

test:
  stage: test

  script:
    - echo "TEST STAGE"
    - echo "Running JUnit tests"
    - cd Example_101
    - mvn --batch-mode --no-transfer-progress test

  artifacts:
    when: always
    name: "example-101-test-results"
    paths:
      - Example_101/target/surefire-reports/
    reports:
      junit:
        - Example_101/target/surefire-reports/TEST-*.xml
    expire_in: 1 week

  allow_failure: false

package:
  stage: package

  script:
    - echo "PACKAGE STAGE"
    - echo "Creating executable JAR"
    - cd Example_101
    - mvn --batch-mode --no-transfer-progress clean package -DskipTests
    - echo "Contents of target directory:"
    - ls -la target/

  artifacts:
    name: "example-101-jar"
    paths:
      - Example_101/target/*.jar
    expire_in: 1 year

run:
  stage: run

  script:
    - echo "RUN STAGE"
    - cd Example_101
    - echo "Contents of target directory:"
    - ls -la target/
    - echo "Starting application..."
    - java -jar target/*.jar "$APP_ARGUMENT"

  allow_failure: false

deploy:
  stage: deploy

  script:
    - echo "DEPLOY STAGE"
    - echo "Deploying Example_101"
    - echo "Deployment completed successfully"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  when: on_success
